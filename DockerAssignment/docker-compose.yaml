# Use postgres/example user/password credentials

services: 
  app:
    build: . #there is no image for this so make one using the dockerfile in this folder
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL} 
    depends_on:
      - db


  db:
    image: postgres:17
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs 
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      #whatever you store in the right thing store it in postgres_data too (our volume)
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      # whatever is in this file of mine move it to this location cuz that's what docker always runs at the start 
  adminer: 
    image: adminer
    restart: always
    ports:
      - 8081:8080  
volumes:
  postgres_data: 

